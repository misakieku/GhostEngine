    path: src/Runtime/Ghost.Graphics.RHI/ICommandBuffer.cs
    startLine: 65
  assemblies:
  - Ghost.Graphics.RHI
  namespace: Ghost.Graphics.RHI
  summary: Sets the optional render targets and optional depth Target for subsequent rendering operations.
  remarks: >-
    To specify no render targets, provide an empty span for <code class="paramref">renderTargets</code>.

    Use <xref href="Ghost.Core.Handle%601.Invalid" data-throw-if-not-resolved="false"></xref> for <code class="paramref">depthTarget</code> if no depth Target is required.
  example: []
  syntax:
    content: void SetRenderTargets(ReadOnlySpan<Handle<Texture>> renderTargets, Handle<Texture> depthTarget)
    parameters:
    - id: renderTargets
      type: System.ReadOnlySpan{Ghost.Core.Handle{Ghost.Graphics.RHI.Texture}}
      description: >-
        A read-only span of handles to textures that will be used as render targets.
            The order of handles determines the order in which render targets are bound.
    - id: depthTarget
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.Texture}
      description: A handle to the texture to be used as the depth Target. Specify a invalid handle if no depth Target is required.
    content.vb: Sub SetRenderTargets(renderTargets As ReadOnlySpan(Of Handle(Of Texture)), depthTarget As Handle(Of Texture))
  overload: Ghost.Graphics.RHI.ICommandBuffer.SetRenderTargets*
