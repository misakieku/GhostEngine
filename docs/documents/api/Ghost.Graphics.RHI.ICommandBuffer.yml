  assemblies:
  - Ghost.Graphics.RHI
  namespace: Ghost.Graphics.RHI
  summary: Copies a region of a source texture to a destination texture. The source and destination regions can be specified to copy a subset of the textures, or the entire textures if the regions are null.
  example: []
  syntax:
    content: void CopyTexture(Handle<Texture> dst, TextureRegion? dstRegion, Handle<Texture> src, TextureRegion? srcRegion)
    parameters:
    - id: dst
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.Texture}
      description: The handle to the destination texture where data will be written.
    - id: dstRegion
      type: System.Nullable{Ghost.Graphics.RHI.TextureRegion}
      description: The region of the destination texture to copy to. If null, the entire texture will be used.
    - id: src
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.Texture}
      description: The handle to the source texture from which data will be read.
    - id: srcRegion
      type: System.Nullable{Ghost.Graphics.RHI.TextureRegion}
      description: The region of the source texture to copy from. If null, the entire texture will be used.
    content.vb: Sub CopyTexture(dst As Handle(Of Texture), dstRegion As TextureRegion?, src As Handle(Of Texture), srcRegion As TextureRegion?)
  overload: Ghost.Graphics.RHI.ICommandBuffer.CopyTexture*
