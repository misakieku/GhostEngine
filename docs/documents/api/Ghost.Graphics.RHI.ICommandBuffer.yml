  assemblies:
  - Ghost.Graphics.RHI
  namespace: Ghost.Graphics.RHI
  summary: Copies a specified number of bytes from the source graphics buffer to the destination graphics buffer.
  example: []
  syntax:
    content: void CopyBuffer(Handle<GraphicsBuffer> dest, Handle<GraphicsBuffer> src, ulong destOffset = 0, ulong srcOffset = 0, ulong numBytes = 0)
    parameters:
    - id: dest
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.GraphicsBuffer}
      description: The handle to the destination graphics buffer where data will be written.
    - id: src
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.GraphicsBuffer}
      description: The handle to the source graphics buffer from which data will be read.
    - id: destOffset
      type: System.UInt64
      description: The byte Offset in the destination buffer at which to begin writing. Must be zero or greater.
    - id: srcOffset
      type: System.UInt64
      description: The byte Offset in the source buffer at which to begin reading. Must be zero or greater.
    - id: numBytes
      type: System.UInt64
      description: The number of bytes to copy. If zero, copies the remaining bytes from the source buffer starting at <code class="paramref">srcOffset</code>.
    content.vb: Sub CopyBuffer(dest As Handle(Of GraphicsBuffer), src As Handle(Of GraphicsBuffer), destOffset As ULong = 0, srcOffset As ULong = 0, numBytes As ULong = 0)
