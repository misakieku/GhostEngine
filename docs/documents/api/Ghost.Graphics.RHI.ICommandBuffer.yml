  assemblies:
  - Ghost.Graphics.RHI
  namespace: Ghost.Graphics.RHI
  summary: Clears the specified depth-stencil view by resetting its depth and/or stencil values.
  example: []
  syntax:
    content: void ClearDepthStencilView(Handle<Texture> depthStencil, bool inlcludeDepth, bool includeStencil, float clearDepth = 1, byte clearStencil = 0)
    parameters:
    - id: depthStencil
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.Texture}
      description: A handle to the depth-stencil texture to be cleared. Must reference a valid depth-stencil resource.
    - id: inlcludeDepth
      type: System.Boolean
      description: A value indicating whether the depth component should be cleared.
    - id: includeStencil
      type: System.Boolean
      description: A value indicating whether the stencil component should be cleared.
    - id: clearDepth
      type: System.Single
      description: The value to which the depth buffer will be set. Typically ranges from 0.0f (nearest) to 1.0f (farthest).
    - id: clearStencil
      type: System.Byte
      description: The value to which the stencil buffer will be set. Must be a valid stencil value supported by the format.
    content.vb: Sub ClearDepthStencilView(depthStencil As Handle(Of Texture), inlcludeDepth As Boolean, includeStencil As Boolean, clearDepth As Single = 1, clearStencil As Byte = 0)
