  assemblies:
  - Ghost.Graphics.RHI
  namespace: Ghost.Graphics.RHI
  summary: Creates a temporary upload buffer of the specified size in bytes.
  remarks: This method has been optimized for frequent calls during frame updates. It efficiently manages memory to minimize fragmentation and overhead.
  example: []
  syntax:
    content: Handle<GraphicsBuffer> CreateTempUploadBuffer(ulong sizeInBytes, out ulong offset)
    parameters:
    - id: sizeInBytes
      type: System.UInt64
      description: The size of the upload buffer to create, in bytes.
    - id: offset
      type: System.UInt64
      description: The offset within the upload buffer where the allocation begins.
    return:
      type: Ghost.Core.Handle{Ghost.Graphics.RHI.GraphicsBuffer}
      description: An <xref href="Ghost.Core.Handle%601" data-throw-if-not-resolved="false"></xref> pointing to the created upload buffer.
    content.vb: Function CreateTempUploadBuffer(sizeInBytes As ULong, offset As ULong) As Handle(Of GraphicsBuffer)
